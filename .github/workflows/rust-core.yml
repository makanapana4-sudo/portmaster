name: Rust Core

concurrency:
  group: rust-core-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - development
      - main
    paths:
      - 'rust-core/**'
      - 'windows_kext/protocol/**'
      - '.github/workflows/rust-core.yml'
  pull_request:
    branches:
      - development
      - main
    paths:
      - 'rust-core/**'
      - '.github/workflows/rust-core.yml'

permissions:
  contents: read

jobs:
  test:
    name: Check Rust core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Test shared Windows driver protocol
        run: cargo test --manifest-path windows_kext/protocol/Cargo.toml

      - name: Check formatting
        run: cargo fmt --manifest-path rust-core/Cargo.toml --all -- --check

      - name: Run Clippy
        run: cargo clippy --manifest-path rust-core/Cargo.toml --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --manifest-path rust-core/Cargo.toml --workspace
